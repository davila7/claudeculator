name: Ultrareview

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ultrareview:
    if: github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install -g @anthropic-ai/claude-code

      - name: Run claude ultrareview
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: claude ultrareview ${{ github.event.pull_request.number }} > review.txt

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = '## Claude Ultrareview\n\n' +
              (fs.existsSync('review.txt')
                ? fs.readFileSync('review.txt', 'utf8').slice(0, 60000)
                : '_No findings produced._');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
